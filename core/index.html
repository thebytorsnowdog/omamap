<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Keep in step with host/scheme.cpp, which sends the same policy as a header (plus frame-ancestors). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; worker-src 'self'; style-src 'self'; img-src 'self' data: https://tile.openstreetmap.org https://server.arcgisonline.com https://a.tile.opentopomap.org https://b.tile.opentopomap.org https://c.tile.opentopomap.org; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>OmaMap</title>
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><span class="mark" aria-hidden="true">◆</span>OMAMAP</div>
    <div class="basemaps" role="group" aria-label="Basemap" id="basemaps"></div>
    <div class="spacer"></div>
    <div class="meta" aria-live="polite"><b id="meta-layers">0</b> layers · <b id="meta-features">0</b> features</div>
  </header>

  <main class="body">
    <aside class="sidebar" aria-label="Datasets">
      <div class="section-head">
        <h2>Datasets</h2>
        <span class="head-actions">
          <button type="button" class="btn" id="btn-save" title="Save profile: datasets, styles and view (Ctrl+S)" disabled>Save</button>
          <button type="button" class="btn" id="btn-open" title="Open data files or a profile (O)">+ Open</button>
        </span>
      </div>
      <input id="file-input" class="sr-only" type="file" multiple
             accept=".geojson,.json,.kml,.kmz,.gpx,.zip,.csv,.tsv,.txt,.shp,.dbf,.prj,.cpg,.omamap" aria-label="Choose data files">
      <div id="layer-list" class="layer-list"></div>
      <button type="button" class="empty" id="layer-empty">
        <span class="empty-title">No datasets yet</span>
        <span>Drop files anywhere, or press <kbd>O</kbd></span>
        <span class="formats">GeoJSON · KML / KMZ · GPX · CSV · Shapefile (.zip or .shp set) · OmaMap profile</span>
      </button>
      <div class="sidebar-foot">
        <button type="button" class="btn subtle" id="btn-fit-all" disabled title="Fit all datasets (F)">Fit all</button>
        <button type="button" class="btn subtle danger" id="btn-clear-all" disabled>Clear all</button>
      </div>
    </aside>

    <div class="center" id="center">
      <div class="map-wrap">
        <div id="map" aria-label="Map"></div>
        <div class="legend" id="legend" aria-label="Legend" hidden></div>
        <div class="drop-veil" id="drop-veil" aria-hidden="true"><div>Drop to add datasets</div></div>
        <div class="loading" id="loading" aria-live="polite" hidden><span class="spinner" aria-hidden="true"></span><span id="loading-msg">Reading…</span><button type="button" class="btn subtle" id="loading-cancel">Cancel</button></div>
      </div>
      <section class="table-panel" id="table-panel" aria-label="Attribute table" hidden>
        <div class="tp-resize" id="tp-resize" title="Drag to resize"></div>
        <div class="tp-head">
          <select id="tp-dataset" aria-label="Dataset"></select>
          <input type="search" id="tp-search" placeholder="Search rows" autocomplete="off" spellcheck="false" aria-label="Search rows">
          <label class="tp-check"><input type="checkbox" id="tp-inview"> In view only</label>
          <span class="tp-count" id="tp-count"></span>
          <span class="spacer"></span>
          <span class="tp-hint">click a row to select · double-click to zoom · ↑↓ to step</span>
          <button type="button" class="icon-btn" id="tp-close" aria-label="Close table (T)" title="Close table (T)">×</button>
        </div>
        <div class="tp-scroll" id="tp-scroll" tabindex="0">
          <div class="tp-header" id="tp-header"></div>
          <div class="tp-body" id="tp-body"></div>
        </div>
      </section>
    </div>

    <aside class="inspector" id="inspector" aria-label="Feature attributes" hidden>
      <div class="insp-head">
        <span class="swatch" id="insp-swatch" aria-hidden="true"></span>
        <div class="insp-title">
          <div class="insp-ds" id="insp-ds"></div>
          <div class="insp-sub" id="insp-sub"></div>
        </div>
        <button type="button" class="icon-btn" id="insp-close" aria-label="Close (Esc)" title="Close (Esc)">×</button>
      </div>
      <div class="insp-hits" id="insp-hits" hidden></div>
      <div class="insp-actions">
        <input type="search" id="attr-filter" placeholder="Filter attributes" autocomplete="off" spellcheck="false" aria-label="Filter attributes">
        <button type="button" class="btn" id="insp-zoom" title="Zoom to feature (Z)">Zoom</button>
        <button type="button" class="btn" id="insp-table" title="Show in attribute table (T)">Table</button>
        <button type="button" class="btn" id="insp-copy" title="Copy attributes as tab-separated text">Copy</button>
      </div>
      <div class="insp-body">
        <table class="attrs"><tbody id="insp-attrs"></tbody></table>
      </div>
    </aside>
  </main>

  <footer class="status">
    <span id="status-text">Ready.</span>
    <span class="spacer"></span>
    <span class="coords" id="coords"></span>
    <span class="keys"><kbd>O</kbd> open <kbd>Ctrl+S</kbd> save <kbd>B</kbd> basemap <kbd>F</kbd> fit <kbd>Z</kbd> zoom <kbd>T</kbd> table <kbd>L</kbd> legend <kbd>Esc</kbd> clear</span>
  </footer>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="vendor/leaflet.js"></script>
<script src="vendor/togeojson.umd.js"></script>
<script src="fastpoints.js"></script>
<script src="spatial.js"></script>
<script src="parse.js"></script>
<script src="basemaps.js"></script>
<script src="style.js"></script>
<script src="table.js"></script>
<script src="app.js"></script>
</body>
</html>
