<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org https://*.basemaps.cartocdn.com https://server.arcgisonline.com https://*.tile.opentopomap.org; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>OmaMap</title>
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><span class="mark" aria-hidden="true">◆</span>OMAMAP</div>
    <div class="basemaps" role="group" aria-label="Basemap" id="basemaps"></div>
    <div class="spacer"></div>
    <div class="meta" aria-live="polite"><b id="meta-layers">0</b> layers · <b id="meta-features">0</b> features</div>
  </header>

  <main class="body">
    <aside class="sidebar" aria-label="Datasets">
      <div class="section-head">
        <h2>Datasets</h2>
        <button type="button" class="btn" id="btn-open" title="Open files (O)">+ Open</button>
      </div>
      <input id="file-input" class="sr-only" type="file" multiple
             accept=".geojson,.json,.kml,.gpx,.zip,.csv,.tsv,.txt,.shp,.dbf,.prj,.cpg" aria-label="Choose data files">
      <div id="layer-list" class="layer-list"></div>
      <button type="button" class="empty" id="layer-empty">
        <span class="empty-title">No datasets yet</span>
        <span>Drop files anywhere, or press <kbd>O</kbd></span>
        <span class="formats">GeoJSON · KML · GPX · CSV · Shapefile (.zip or .shp set)</span>
      </button>
      <div class="sidebar-foot">
        <button type="button" class="btn subtle" id="btn-fit-all" disabled title="Fit all datasets (F)">Fit all</button>
        <button type="button" class="btn subtle danger" id="btn-clear-all" disabled>Clear all</button>
      </div>
    </aside>

    <div class="map-wrap">
      <div id="map" aria-label="Map"></div>
      <div class="drop-veil" id="drop-veil" aria-hidden="true"><div>Drop to add datasets</div></div>
      <div class="loading" id="loading" aria-live="polite" hidden><span class="spinner" aria-hidden="true"></span><span id="loading-msg">Reading…</span></div>
    </div>

    <aside class="inspector" id="inspector" aria-label="Feature attributes" hidden>
      <div class="insp-head">
        <span class="swatch" id="insp-swatch" aria-hidden="true"></span>
        <div class="insp-title">
          <div class="insp-ds" id="insp-ds"></div>
          <div class="insp-sub" id="insp-sub"></div>
        </div>
        <button type="button" class="icon-btn" id="insp-close" aria-label="Close (Esc)" title="Close (Esc)">×</button>
      </div>
      <div class="insp-hits" id="insp-hits" hidden></div>
      <div class="insp-actions">
        <input type="search" id="attr-filter" placeholder="Filter attributes" autocomplete="off" spellcheck="false" aria-label="Filter attributes">
        <button type="button" class="btn" id="insp-zoom" title="Zoom to feature (Z)">Zoom</button>
        <button type="button" class="btn" id="insp-copy" title="Copy attributes as tab-separated text">Copy</button>
      </div>
      <div class="insp-body">
        <table class="attrs"><tbody id="insp-attrs"></tbody></table>
      </div>
    </aside>
  </main>

  <footer class="status">
    <span id="status-text">Ready.</span>
    <span class="spacer"></span>
    <span class="coords" id="coords"></span>
    <span class="keys"><kbd>O</kbd> open <kbd>B</kbd> basemap <kbd>F</kbd> fit <kbd>Z</kbd> zoom <kbd>Esc</kbd> clear</span>
  </footer>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="vendor/leaflet.js"></script>
<script src="vendor/togeojson.umd.js"></script>
<script src="parse.js"></script>
<script src="basemaps.js"></script>
<script src="app.js"></script>
</body>
</html>
