name: Vendored dependency security
on:
  pull_request:
    paths:
      - core/vendor/**
      - packaging/vendor-dependencies.json
      - scripts/check-vendor-advisories.py
      - .github/workflows/vendor-security.yml
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/check-vendor-advisories.py
        env:
          GH_TOKEN: ${{ github.token }}
