name: Vendored dependency security
on:
  workflow_call:
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - name: Test advisory request credentials
        run: python3 -m unittest discover -s tests -p test_vendor_auth.py -v
      - name: Check for vendored dependency changes
        if: github.event_name == 'pull_request'
        id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set +e
          git diff --quiet --no-renames "$BASE...$HEAD" -- core/vendor/ \
            packaging/vendor-dependencies.json scripts/check-vendor-advisories.py tests/test_vendor_auth.py \
            .github/workflows/vendor-security.yml .github/workflows/ci.yml
          status=$?
          set -e
          case "$status" in
            0) echo "audit=false" >> "$GITHUB_OUTPUT" ;;
            1) echo "audit=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac
      - run: python3 scripts/check-vendor-advisories.py
        if: github.event_name != 'pull_request' || steps.paths.outputs.audit == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
