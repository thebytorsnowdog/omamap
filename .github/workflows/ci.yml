name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    name: JavaScript checks (Node 24)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
  checks:
    name: OmaMap checks
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      # Pinned by digest (archlinux:base-devel as of 2026-09-28) so the base
      # image cannot change under a run. pacman -Syu still installs current
      # Arch packages: Arch does not support partial upgrades, so bump this
      # digest deliberately rather than freezing packages.
      image: archlinux:base-devel@sha256:51dd3d24f7fba779e7c471caeee7804c50e8c134ad948e19685a1c83a42facc3
      options: --shm-size=1g
    env:
      # The disposable container runs as root. This is only for CI; the
      # installed application never disables the WebEngine sandbox.
      QTWEBENGINE_DISABLE_SANDBOX: '1'
    steps:
      - name: Install build and test dependencies
        run: pacman -Syu --noconfirm --needed git cmake qt6-base qt6-webengine nodejs npm chromium jq python mesa xorg-server-xvfb xorg-xauth ttf-dejavu dbus
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trust the checked-out workspace in this disposable container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: npm ci --ignore-scripts
      - run: npm run test:browser
      - run: cmake -S host -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
      - name: Native host smoke tests
        run: xvfb-run -a dbus-run-session -- tests/host-smoke.sh
        env:
          QT_QPA_PLATFORM: xcb
          LIBGL_ALWAYS_SOFTWARE: '1'
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: integration-failure-diagnostics
          path: |
            tests/output/
            build/Testing/Temporary/
          retention-days: 7
          if-no-files-found: ignore
